name: CI

on:
  push:
    branches: [main, main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest

    features = airframe, huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions-rs/cargo@v1
        with:
          cache: registry

      - name: Build (offline)
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --offline --release

      - name: Test (offline)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --offline

      - name: Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets -- -D warnings

      - name: Format check
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --check