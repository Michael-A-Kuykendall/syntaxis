name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        rust: ["1.75.0", stable]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup component add clippy rustfmt --toolchain "${{ matrix.rust }}"
          rustup default "${{ matrix.rust }}"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build (offline)
        run: cargo build --offline --release

      - name: Check WebAssembly API
        if: matrix.rust == 'stable'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --features wasm --offline

      - name: Test WebAssembly API
        if: matrix.rust == 'stable'
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          wasm-pack test --node --no-default-features --features wasm

      - name: Test (offline)
        run: cargo test --offline

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Release gate
        if: matrix.rust == 'stable'
        run: make gate

      - name: Cargo deny
        if: matrix.rust == 'stable'
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check
