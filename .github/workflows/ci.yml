name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        rust: ["1.75.0", stable]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal
          rustup component add clippy rustfmt --toolchain "${{ matrix.rust }}"
          rustup default "${{ matrix.rust }}"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build (offline)
        run: cargo build --offline --release

      - name: Check WebAssembly API
        if: matrix.rust == 'stable'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --features wasm --offline

      - name: Test (offline)
        run: cargo test --offline

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Release gate
        if: matrix.rust == 'stable'
        run: make gate

      - name: Cargo deny
        if: matrix.rust == 'stable'
        run: cargo install cargo-deny --version 0.18.5 --locked && cargo deny check
