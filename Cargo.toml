[package]
name = "syntaxis"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Michael-A-Kuykendall/syntaxis"
homepage = "https://github.com/Michael-A-Kuykendall/syntaxis"
description = "Deterministic, offline English structural analysis."
readme = "README.md"
exclude = [
    ".agents/**",
    ".beads/**",
    ".claude/**",
    ".codex/**",
    ".github/**",
    ".serena/**",
    "Cargo.toml.orig",
]
keywords = ["nlp", "english", "deterministic", "parser", "structural-analysis"]
categories = ["text-processing", "parsing"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.105", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.50"

[lib]
name = "syntaxis"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "syntaxis"
path = "src/bin/syntaxis.rs"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
