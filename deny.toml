# cargo-deny configuration.
#
# The default native feature set has no runtime dependencies. The optional Wasm
# feature and its tests use a reviewed binding stack. This file is committed as
# a ratchet: any future dependency change is checked by CI immediately.
#
#   cargo install cargo-deny && cargo deny check

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
# Permissive only. The engine ships reference data whose licensing is already
# the project's most delicate area; adding copyleft code obligations on top is
# not acceptable.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.95
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"

# Specific bans, with reasons. These are the crates most likely to be reached
# for by someone "just making the tests nicer" who has not read CONTRIBUTING.md.
[[bans.deny]]
name = "rand"
reason = "randomness in any form breaks the determinism contract"

[[bans.deny]]
name = "chrono"
reason = "wall-clock values must never reach serialized output"

[[bans.deny]]
name = "time"
reason = "wall-clock values must never reach serialized output"

[[bans.deny]]
name = "ahash"
reason = "randomly-seeded hashing produces order-dependent iteration"

[[bans.deny]]
name = "reqwest"
reason = "the engine is offline by contract"

[[bans.deny]]
name = "ureq"
reason = "the engine is offline by contract"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
